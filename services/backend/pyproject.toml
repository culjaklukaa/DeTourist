[tool.poetry]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for DeTourist"
authors = ["DeTourist Team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.28.0"}
celery = "^5.3.6"
redis = "^5.0.3"
sqlalchemy = "^2.0.29"
geoalchemy2 = "^0.14.6"
psycopg = {extras = ["binary"], version = "^3.1.18"}
alembic = "^1.13.1"
pydantic-settings = "^2.2.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
httpx = "^0.27.0"
pytest-asyncio = "^0.23.6"
ruff = "^0.3.4"
mypy = "^1.9.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "app"]

[tool.ruff]
line-length = 88
target-version = "py312"
